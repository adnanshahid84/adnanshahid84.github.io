bio: |
  Adnan Shahid is an Assistant Professor at Ghent University and a Principal Investigator at imec. He leads AI/ML for Wireless at IDLab-iWiNe. His work focuses on artificial intelligence and machine learning for wireless communications and networks, including 5G/6G, RF signal intelligence, and radio access network optimization.

